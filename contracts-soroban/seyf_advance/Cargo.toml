[package]
name = "seyf-advance"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Solo testnet: un día de plazo dura 60 s (ver SECONDS_PER_DAY en lib.rs).
fast-time = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
