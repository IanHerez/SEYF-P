[workspace]
resolver = "2"
members = ["seyf_advance"]

[workspace.dependencies]
# Fijado a la versión exacta que se audita y despliega (protocolo 29).
soroban-sdk = "=29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
